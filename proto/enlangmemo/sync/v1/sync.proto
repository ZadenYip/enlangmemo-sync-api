syntax = "proto3";

package enlangmemo.sync.v1;

import "enlangmemo/sync/v1/handshake.proto";
import "enlangmemo/sync/v1/pull.proto";
import "enlangmemo/sync/v1/push.proto";

service SyncService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc Pull(PullRequest) returns (PullResponse);
  rpc Push(PushRequest) returns (PushResponse);
}
