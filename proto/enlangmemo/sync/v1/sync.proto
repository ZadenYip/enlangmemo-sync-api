syntax = "proto3";

package enlangmemo.sync.v1;

import "enlangmemo/sync/v1/cancel.proto";
import "enlangmemo/sync/v1/handshake.proto";
import "enlangmemo/sync/v1/finish.proto";
import "enlangmemo/sync/v1/pull.proto";
import "enlangmemo/sync/v1/push.proto";
import "enlangmemo/sync/v1/upload_all.proto";

service SyncService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc Pull(PullRequest) returns (PullResponse);
  rpc Push(PushRequest) returns (PushResponse);
  rpc UploadAllPrepare(UploadAllPrepareRequest) returns (UploadAllPrepareResponse);
  rpc UploadAllPush(UploadAllPushRequest) returns (UploadAllPushResponse);
  rpc FinishSync(FinishSyncRequest) returns (FinishSyncResponse);
  rpc CancelSync(CancelSyncRequest) returns (CancelSyncResponse);
}
