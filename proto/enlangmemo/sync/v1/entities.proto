syntax = "proto3";

package enlangmemo.sync.v1;

import "buf/validate/validate.proto";

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_COLLECTION = 1;
  ENTITY_TYPE_DECK = 2;
  ENTITY_TYPE_NOTE_TYPE = 3;
  ENTITY_TYPE_NOTE = 4;
  ENTITY_TYPE_PROCESSING_NOTE = 5;
  ENTITY_TYPE_CARD = 6;
  ENTITY_TYPE_REVIEW_LOG = 7;
}

// ChangeOp 表示同步实体的变更操作类型
enum ChangeOp {
  CHANGE_OP_UNSPECIFIED = 0;
  CHANGE_OP_UPSERT = 1;
  CHANGE_OP_DELETE = 2;
  CHANGE_OP_ASSIGN_USN = 3;
}

// SyncChange 表示实体的同步变更
message SyncChange {
  // UUID, 16 bytes.
  bytes entity_id = 1 [(buf.validate.field).bytes.len = 16];

  // 实体类型
  EntityType entity_type = 2;

  // 变更操作类型
  ChangeOp op = 3;
  // deleted_at 仅在 op 为 DELETE 时才会有值，表示实体删除的时间戳
  optional int64 deleted_at = 4 [(buf.validate.field).int64.gt = 0];

  int64 usn = 5 [(buf.validate.field).int64.gte = -1];

  // op 为 UPSERT 时 payload 必须存在，为 DELETE / ASSIGN_USN 时则不需要 payload
  oneof payload {
    CollectionPayload collection = 6;
    DeckPayload deck = 7;
    NoteTypePayload note_type = 8;
    ProcessingNotePayload processing_note = 9;
    NotePayload note = 10;
    CardPayload card = 11;
    ReviewLogPayload review_log = 12;
  }
}

// CollectionPayload 承载集合元数据的 UPSERT 负载
message CollectionPayload {
  int32 sqlite_schema_version = 1 [(buf.validate.field).int32.gte = 0];

  int64 created_at = 2 [(buf.validate.field).int64.gt = 0];
  int64 updated_at = 3 [(buf.validate.field).int64.gt = 0];

  // SQLite collection.config 的 JSON 字符串。
  string config_json = 4 [(buf.validate.field).string.min_len = 1];
}

// DeckPayload 承载牌组数据的 UPSERT 负载。
message DeckPayload {
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  int64 updated_at = 2 [(buf.validate.field).int64.gt = 0];
  int32 new_cards_per_day = 3;
  int32 new_learned_today = 4 [(buf.validate.field).int32.gte = 0];
  int32 learned_today = 5 [(buf.validate.field).int32.gte = 0];
  int32 reviewed_today = 6 [(buf.validate.field).int32.gte = 0];

  // SQLite decks.config 的 JSON 字符串
  string config_json = 7 [(buf.validate.field).string.min_len = 1];
}

// NoteTypePayload 承载笔记模板数据的 UPSERT 负载
message NoteTypePayload {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  int32 preset_template_id = 2;
  int64 updated_at = 3 [(buf.validate.field).int64.gt = 0];

  // SQLite note_types.note_template 的 JSON 字符串，包含 css、front、back、sortField、fields 等。
  string note_template_json = 4 [(buf.validate.field).string.min_len = 1];
}

// NotePayload 承载笔记数据的 UPSERT 负载
message NotePayload {
  bytes note_type_id = 1 [(buf.validate.field).bytes.len = 16];
  int64 created_at = 2 [(buf.validate.field).int64.gt = 0];
  int64 updated_at = 3 [(buf.validate.field).int64.gt = 0];
  optional int32 sense_id = 4 [(buf.validate.field).int32.gt = 0];

  // SQLite notes.fields 的 JSON 字符串
  string fields_json = 5 [(buf.validate.field).string.min_len = 1];
}

// ProcessingNotePayload 承载待加工笔记数据的 UPSERT 负载
message ProcessingNotePayload {
  bytes note_type_id = 1 [(buf.validate.field).bytes.len = 16];
  int64 created_at = 2 [(buf.validate.field).int64.gt = 0];
  int64 updated_at = 3 [(buf.validate.field).int64.gt = 0];
  optional int32 sense_id = 4 [(buf.validate.field).int32.gt = 0];

  // SQLite processing_notes.fields 的 JSON 字符串
  string fields_json = 5 [(buf.validate.field).string.min_len = 1];
}

// CardPayload 承载卡片数据的 UPSERT 负载
message CardPayload {
  bytes note_id = 1 [(buf.validate.field).bytes.len = 16];
  bytes deck_id = 2 [(buf.validate.field).bytes.len = 16];
  int64 updated_at = 3 [(buf.validate.field).int64.gt = 0];

  double difficulty = 4;
  double stability = 5;
  int32 scheduled_days = 6;

  int64 due = 7 [(buf.validate.field).int64.gte = 0];

  optional int64 last_review = 8 [(buf.validate.field).int64.gte = 0];
  int32 lapses = 9 [(buf.validate.field).int32.gte = 0];
  int32 learning_steps = 10 [(buf.validate.field).int32.gte = 0];
  int32 repetitions = 11 [(buf.validate.field).int32.gte = 0];
  int32 state = 12;
  int32 queue = 13;
}

// ReviewLogPayload 承载复习记录数据的 UPSERT 负载
message ReviewLogPayload {
  bytes card_id = 1 [(buf.validate.field).bytes.len = 16];

  int64 review_time = 2 [(buf.validate.field).int64.gte = 0];
  int32 scheduled_days = 3;

  int32 rating = 4 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 4
  ];
  double difficulty = 5;
  double stability = 6;

  int32 learning_steps = 7 [(buf.validate.field).int32.gte = 0];
  int32 state = 8;
  int32 duration = 9 [(buf.validate.field).int32.gte = 0];
}
