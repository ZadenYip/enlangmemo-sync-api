syntax = "proto3";

package enlangmemo.sync.v1;

import "buf/validate/validate.proto";

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_COLLECTION = 1;
  ENTITY_TYPE_DECK = 2;
  ENTITY_TYPE_NOTE_TYPE = 3;
  ENTITY_TYPE_NOTE = 4;
  ENTITY_TYPE_PROCESSING_NOTE = 5;
  ENTITY_TYPE_CARD = 6;
  ENTITY_TYPE_REVIEW_LOG = 7;
}

// ChangeOp 表示同步实体的变更操作类型
enum ChangeOp {
  CHANGE_OP_UNSPECIFIED = 0;
  CHANGE_OP_UPSERT = 1;
  CHANGE_OP_DELETE = 2;
}

// SyncChange 表示实体的同步变更
message SyncChange {
  // UUID
  string entity_id = 1 [(buf.validate.field).string.len = 36];

  // 实体类型
  EntityType entity_type = 2;

  // 变更操作类型
  ChangeOp op = 3;

  int64 usn = 4 [(buf.validate.field).int64.gte = -1];

  // op 为 UPSERT 时 payload 必须存在，为 DELETE 时则不需要 payload
  oneof payload {
    // 这里是故意 Collection(16) 与 ReviewLog(10) 序号进行了调换
    //
    // protobuf 序号 16 需要 2 字节编码，0 ~ 15 只要 1 字节
    // 把 16 给 Collection 比 ReviewLog 更省，
    // 因为 ReviewLog 可能会有很多条，Collection 只有一条。
    CollectionPayload collection = 16;
    DeckPayload deck = 11;
    NoteTypePayload note_type = 12;
    ProcessingNotePayload processing_note = 13;
    NotePayload note = 14;
    CardPayload card = 15;
    ReviewLogPayload review_log = 10;
  }
}

// CollectionPayload 承载集合元数据的 UPSERT 负载
message CollectionPayload {
  int32 sqlite_schema_version = 1 [(buf.validate.field).int32.gte = 0];
  int64 created_at = 2 [(buf.validate.field).int64.gte = 0];
  int64 updated_at = 3 [(buf.validate.field).int64.gte = 0];

  // SQLite collection.config 的 JSON 字符串。
  string config_json = 4 [(buf.validate.field).string.min_len = 1];
}

// DeckPayload 承载牌组数据的 UPSERT 负载。
message DeckPayload {
  string id = 1 [(buf.validate.field).string.len = 36];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  int64 updated_at = 3 [(buf.validate.field).int64.gte = 0];
  int32 new_cards_per_day = 4;
  int32 new_learned_today = 5 [(buf.validate.field).int32.gte = 0];
  int32 learned_today = 6 [(buf.validate.field).int32.gte = 0];
  int32 reviewed_today = 7 [(buf.validate.field).int32.gte = 0];

  // SQLite decks.config 的 JSON 字符串
  string config_json = 8 [(buf.validate.field).string.min_len = 1];
}

// NoteTypePayload 承载笔记模板数据的 UPSERT 负载
message NoteTypePayload {
  string id = 1 [(buf.validate.field).string.len = 36];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  int32 preset_template_id = 3 [(buf.validate.field).int32.gte = 0];
  int64 updated_at = 4 [(buf.validate.field).int64.gte = 0];

  // SQLite note_types.note_template 的 JSON 字符串，包含 css、front、back、sortField、fields 等。
  string note_template_json = 5 [(buf.validate.field).string.min_len = 1];
}

// NotePayload 承载笔记数据的 UPSERT 负载
message NotePayload {
  string id = 1 [(buf.validate.field).string.len = 36];
  string note_type_id = 2 [(buf.validate.field).string.len = 36];
  int64 created_at = 3 [(buf.validate.field).int64.gte = 0];
  int64 updated_at = 4 [(buf.validate.field).int64.gte = 0];
  optional int64 sense_id = 5 [(buf.validate.field).int64.gte = 0];
  optional string sort_field = 6;
  optional string search_fields = 7;

  // SQLite notes.fields 的 JSON 字符串
  string fields_json = 8 [(buf.validate.field).string.min_len = 1];
}

// ProcessingNotePayload 承载待加工笔记数据的 UPSERT 负载
message ProcessingNotePayload {
  string id = 1 [(buf.validate.field).string.len = 36];
  string note_type_id = 2 [(buf.validate.field).string.len = 36];
  int64 created_at = 3 [(buf.validate.field).int64.gte = 0];
  int64 updated_at = 4 [(buf.validate.field).int64.gte = 0];
  optional int64 sense_id = 5 [(buf.validate.field).int64.gte = 0];

  // SQLite processing_notes.fields 的 JSON 字符串
  string fields_json = 6 [(buf.validate.field).string.min_len = 1];
}

// CardPayload 承载卡片数据的 UPSERT 负载
message CardPayload {
  string id = 1 [(buf.validate.field).string.len = 36];
  string note_id = 2 [(buf.validate.field).string.len = 36];
  string deck_id = 3 [(buf.validate.field).string.len = 36];
  int64 updated_at = 4 [(buf.validate.field).int64.gte = 0];

  double difficulty = 5;
  double stability = 6;
  int32 scheduled_days = 7;

  int64 due = 8 [(buf.validate.field).int64.gte = 0];

  optional int64 last_review = 9 [(buf.validate.field).int64.gte = 0];
  int32 lapses = 10 [(buf.validate.field).int32.gte = 0];
  int32 learning_steps = 11 [(buf.validate.field).int32.gte = 0];
  int32 repetitions = 12 [(buf.validate.field).int32.gte = 0];
  int32 state = 13;
  int32 queue = 14;
}

// ReviewLogPayload 承载复习记录数据的 UPSERT 负载
message ReviewLogPayload {
  string id = 1 [(buf.validate.field).string.len = 36];
  string card_id = 2 [(buf.validate.field).string.len = 36];

  int64 review_time = 3 [(buf.validate.field).int64.gte = 0];
  int32 scheduled_days = 4;

  int32 rating = 5 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 4
  ];
  double difficulty = 6;
  double stability = 7;

  int32 learning_steps = 8 [(buf.validate.field).int32.gte = 0];
  int32 state = 9;
  int64 duration = 10 [(buf.validate.field).int64.gte = 0];
}
