name: CI

on:
  pull_request:
  push:
    tags:
      - "packages/go/v*"
      - "packages/ts/v*"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  buf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Buf checks
        uses: bufbuild/buf-action@v1
        with:
          push: false

  sdk:
    runs-on: ubuntu-latest
    needs: buf

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDKs
        run: pnpm buf generate

      - name: Check generated code is committed
        run: git diff --exit-code

      - name: Setup Go
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/packages/go/v')
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: packages/go/go.sum

      - name: Test Go SDK
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/packages/go/v')
        working-directory: packages/go
        run: go test ./...

      - name: Build TypeScript SDK
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/packages/ts/v')
        working-directory: packages/ts
        run: pnpm build

      - name: Publish TypeScript SDK
        if: startsWith(github.ref, 'refs/tags/packages/ts/v')
        working-directory: packages/ts
        run: pnpm publish --no-git-checks
